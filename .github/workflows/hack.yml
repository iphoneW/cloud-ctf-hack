name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Check Lambda Function URL & Configuration
        run: |
          echo "=== 1. Verify Identity ==="
          aws sts get-caller-identity

          echo "=== 2. Check for Lambda Function URL ==="
          aws lambda get-function-url-config --function-name nslookupv2 || echo "No Function URL configured directly"

          echo "=== 3. Get Full Function Details ==="
          aws lambda get-function --function-name nslookupv2
