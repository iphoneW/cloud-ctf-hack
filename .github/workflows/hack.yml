name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          echo "=== 1. CHECKING LAMBDA RESOURCE POLICY ==="
          # This reveals what services are allowed to trigger the function
          aws lambda get-policy --function-name nslookupv2 > policy.json || echo "Access Denied to GetPolicy"
          cat policy.json
          
          echo "=== 2. ENUMERATING API GATEWAYS ==="
          # If it's attached to an API, these commands will find the API IDs
          aws apigateway get-rest-apis || echo "Access Denied to v1 APIs"
          aws apigatewayv2 get-apis || echo "Access Denied to v2 APIs"
          
          echo "=== 3. CHECKING OUR OWN PERMISSIONS ==="
          # Let's see exactly what policies are attached to our cicdRole so we know our limits
          aws iam list-attached-role-policies --role-name cicdRole || echo "Access Denied to Attached Policies"
          aws iam list-role-policies --role-name cicdRole || echo "Access Denied to Inline Policies"
